[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-reasoning"
version = "0.1.0"
description = "Data contracts and telemetry compression for robotics failure explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[project.optional-dependencies]
sim = ["mujoco>=3.0"]
llm = [
    "torch>=2.2",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.10",
    "bitsandbytes>=0.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
